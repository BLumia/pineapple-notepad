name: Kf6redist CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
        include:
          - os: windows-2025
            qt_ver: '6.12.0'
            aqt_arch: win64_msvc2022_64
            os_label: win
          - os: macos-26
            qt_ver: '6.12.0'
            aqt_arch: clang_64
            os_label: mac

    steps:
    - uses: actions/checkout@v6
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        arch: ${{ matrix.aqt_arch }}
        version: ${{ matrix.qt_ver }}
        modules: 'qt5compat'
        cache: true
        aqtsource: 'aqtinstall @ git+https://github.com/miurahr/aqtinstall@16db45a70b5905ad596941b223469bc86a56901e'
    - name: Install Gettext and Ninja (Windows)
      if: runner.os == 'Windows'
      uses: MinoruSekine/setup-scoop@v4.0.2
      with:
        buckets: extras
        apps: gettext ninja
    - name: Install Gettext and Ninja (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gettext ninja
    - name: Download kf6redist
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        $deps = Join-Path $PWD "build_dependencies"
        New-Item -ItemType Directory -Force -Path $deps | Out-Null

        if ($IsWindows) {
          Invoke-WebRequest -Uri "https://github.com/BLumia/kf6redist/releases/download/kf6.31.0/win-x64-vs2022-qt6.12.0-kfv6.31.0.zip" -OutFile "kf6redist.zip"
        } elseif ($IsMacOS) {
          Invoke-WebRequest -Uri "https://github.com/BLumia/kf6redist/releases/download/kf6.31.0/mac-arm64-vs0-qt6.12.0-kfv6.31.0.zip" -OutFile "kf6redist.zip"
        }

        $kf6Dir = Join-Path $deps "kf6redist"
        7z x kf6redist.zip -y "-o$kf6Dir"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Add-Content $env:GITHUB_ENV "KF6REDIST_DIR=$kf6Dir"
    - name: Build
      shell: pwsh
      run: |
        ./.github/scripts/build.ps1
        ./.github/scripts/build.ps1 -Deploy
    - uses: actions/upload-artifact@v6
      with:
        name: "${{ matrix.os_label }}-${{ matrix.aqt_arch }}-qt${{ matrix.qt_ver }}-pnotepad"
        path: |
          install-msvc/bin/*
          build/*.dmg
